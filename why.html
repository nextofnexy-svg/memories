
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why I Like You ♡</title>
<link rel="stylesheet" href="style.css">
<style>
.letter {
  white-space: pre-wrap;
  line-height: 1.9;
  text-align: left;
  margin-top: 24px;
}
.back {
  display: inline-block;
  margin-top: 20px;
  color: inherit;
  text-decoration: none;
}
</style>
</head>
<body>
<main class="wrap">
  <section id="login" class="panel login">
    <div class="heart">♡</div>
    <p class="eyebrow">JUST FOR YOU</p>
    <h1>Why I Like You</h1>
    <p class="muted">A little letter, just for us.</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" required
        autocomplete="username" placeholder="ria or nextofnexy">

      <label for="password">Password</label>
      <input id="password" type="password" required
        autocomplete="current-password" placeholder="Enter the new password">

      <button id="unlockBtn" type="submit">Unlock this letter ♡</button>
    </form>

    <p id="loginMsg" class="msg"></p>
    <a class="back" href="index.html">← Back to Our Memories</a>
  </section>

  <section id="letterPage" class="panel hidden">
    <div class="heart">♡</div>
    <p class="eyebrow">A LITTLE SOMETHING FOR YOU</p>
    <h1>Why I Like You</h1>
    <p id="letter" class="letter"></p>
    <button id="lockBtn" type="button">Lock letter ♡</button>
    <a class="back" href="index.html">← Back to Our Memories</a>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const allowedUsernames = ["ria", "nextofnexy"];
  const accountEmail = "nextofnexy@gmail.com";

  if (!window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY) {
    $("loginMsg").textContent = "Setup error: check config.js.";
    return;
  }

  const db = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_PUBLISHABLE_KEY
  );

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();

    const username = $("username").value.trim().toLowerCase();
    const password = $("password").value;

    if (!allowedUsernames.includes(username)) {
      $("loginMsg").textContent = "Username not recognized.";
      return;
    }

    $("unlockBtn").disabled = true;
    $("loginMsg").textContent = "Checking password…";

    try {
      const { error: authError } = await db.auth.signInWithPassword({
        email: accountEmail,
        password
      });

      if (authError) {
        $("loginMsg").textContent = "Incorrect password. Try again.";
        return;
      }

      const { data, error } = await db
        .from("why_i_like_you")
        .select("paragraph")
        .eq("id", 1)
        .single();

      if (error || !data) {
        $("loginMsg").textContent =
          "Couldn't load the letter. Check the Supabase table permissions.";
        return;
      }

      $("letter").textContent = data.paragraph;
      $("login").classList.add("hidden");
      $("letterPage").classList.remove("hidden");
      $("loginMsg").textContent = "";
      $("password").value = "";
    } catch {
      $("loginMsg").textContent = "Something went wrong. Please try again.";
    } finally {
      $("unlockBtn").disabled = false;
    }
  });

  $("lockBtn").addEventListener("click", () => {
    $("letter").textContent = "";
    $("letterPage").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("password").value = "";
    $("loginMsg").textContent = "";
  });
})();
</script>
</body>
</html>
