<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Memories ♡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
<section id="login" class="panel login">
<div class="heart">♡</div>
<p class="eyebrow">A LITTLE PLACE FOR US</p>
<h1>Our Memories</h1>
<p class="muted">Some things are just for us.</p>
<form id="loginForm">
<label>Username</label>
<input id="email" type="text" required autocomplete="username" placeholder="Enter username">
<label>Password</label>
<input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
<button>Unlock our memories ♡</button>
</form>
<p id="loginMsg" class="msg"></p>
</section>

<section id="galleryPage" class="hidden">
<header>
<p class="eyebrow">OUR LITTLE CORNER OF THE WORLD</p>
<h1>Our Memories <span>♡</span></h1>
<p class="muted">Every picture holds a little piece of us.</p>
<button id="logout" class="secondary">Sign out</button>
</header>

<section class="panel upload">
<div>
<h2>Add a memory</h2>
<p class="muted">Choose a photo and add a caption.</p>
</div>
<form id="uploadForm">
<label>Photo (max 5 MB)</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required>
<label>Caption</label>
<input id="caption" maxlength="160" placeholder="The day we…">
<button id="uploadBtn">Add photo ♡</button>
<p id="uploadMsg" class="msg"></p>
</form>
</section>

<div class="galleryTitle">
<h2>Our gallery</h2>
<span id="count" class="muted"></span>
</div>
<div id="gallery" class="gallery"></div>
<p id="galleryMsg" class="msg"></p>
<footer>made with love ♡</footer>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
